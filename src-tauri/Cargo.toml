[package]
name = "sys-toolkit"
version = "1.0.0"
description = "系统监控与工具箱"
authors = ["jusg956"]
license = "MIT"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
sysinfo = "0.34"
nvml-wrapper = "0.10"
smbios-lib = "0.9"
netdev = "0.43"
display-info = "0.5"
winreg = "0.52"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
